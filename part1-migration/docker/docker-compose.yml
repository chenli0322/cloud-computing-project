version: '3.8'

services:
  # ---- MySQL 5.7 Database ----
  mysql:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    container_name: archnav-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - archnav-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- ApacheDS LDAP Server ----
  apacheds:
    build:
      context: .
      dockerfile: Dockerfile.apacheds
    container_name: archnav-apacheds
    environment:
      APACHEDS_VERSION: 2.0.0-M23
      FORTRESS_VERSION: ${FORTRESS_VERSION}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
    ports:
      - "${LDAP_PORT}:389"
      - "10389:10389"
    volumes:
      - apacheds-data:/var/lib/apacheds
    networks:
      - archnav-net
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost:10389", "-D", "uid=admin,ou=system", "-w", "secret", "-b", "ou=system", "(objectClass=*)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---- Tomcat 8.5 (Fortress REST + Fortress Web) ----
  tomcat:
    build:
      context: .
      dockerfile: Dockerfile.tomcat
    container_name: archnav-tomcat
    environment:
      FORTRESS_VERSION: ${FORTRESS_VERSION}
    ports:
      - "${TOMCAT_PORT}:8080"
    depends_on:
      apacheds:
        condition: service_healthy
    networks:
      - archnav-net

  # ---- Glassfish 3.1.2 (ArchNav ADF Application) ----
  glassfish:
    build:
      context: .
      dockerfile: Dockerfile.glassfish
    container_name: archnav-glassfish
    environment:
      AS_ADMIN_PASSWORD: ${GLASSFISH_ADMIN_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${GLASSFISH_HTTP_PORT}:9999"
      - "${GLASSFISH_ADMIN_PORT}:4848"
    depends_on:
      mysql:
        condition: service_healthy
      apacheds:
        condition: service_healthy
    networks:
      - archnav-net

volumes:
  mysql-data:
  apacheds-data:

networks:
  archnav-net:
    driver: bridge
